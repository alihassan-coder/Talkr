version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    # Tauri plugins must move together with their @tauri-apps npm packages (same major.minor),
    # or the release breaks: update them by hand, in one PR with package.json.
    ignore:
      - dependency-name: 'tauri-plugin-*'
        update-types: [version-update:semver-minor]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@tauri-apps/plugin-*'
        update-types: [version-update:semver-minor]
      # Majors that need a deliberate migration, not a bot PR: eslint-config-next (the website)
      # does not load under ESLint 10 yet, and TypeScript 7 is the new native compiler.
      - dependency-name: 'eslint'
        update-types: [version-update:semver-major]
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]
