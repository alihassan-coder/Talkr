name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-frontend:
    name: Typecheck, lint, build (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web --filter desktop typecheck
      - run: pnpm --filter web --filter desktop lint
      - run: pnpm --filter web build
      - run: pnpm --filter desktop build

  rust:
    name: Rust check and clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libudev-dev libasound2-dev cmake clang libclang-dev
      # Tauri's build script expects the frontend output folder to exist.
      - run: mkdir -p apps/desktop/dist
      - working-directory: apps/desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
