name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow runs this first and only builds installers when it passes.
  workflow_call:

# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  js:
    name: JS - typecheck, lint, unit tests, builds, web e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      # tauri.conf.json, package.json, the Cargo.tomls and the website must carry one version.
      - run: node scripts/check-versions.mjs
      - run: pnpm install --frozen-lockfile
      # Every model needs a real sha256 and a pinned URL, or the app refuses to install it.
      - run: pnpm --filter @talkr/model-catalog validate --offline
      - run: pnpm --filter web --filter desktop typecheck
      - run: pnpm --filter web --filter desktop lint
      - run: pnpm --filter web --filter desktop test
      - run: pnpm --filter web build
      - run: pnpm --filter desktop build
      - name: Install Playwright's Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  audit:
    name: Rust - security advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Fails on known vulnerabilities; unmaintained/unsound/yanked notices are only printed.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  rust:
    name: Rust - clippy and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    env:
      # Real-model tests: Piper speaks a sentence and Whisper must hear it back.
      TALKR_TEST_MODELS: ${{ github.workspace }}/.test-models
      # macOS engines always have Metal: run the GPU test there too (Apple Silicon runners).
      TALKR_TEST_GPU: ${{ startsWith(matrix.os, 'macos') && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: engine-v3
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libudev-dev libasound2-dev cmake clang libclang-dev
      - name: Cache test models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .test-models
          key: test-models-${{ hashFiles('packages/model-catalog/catalog.json') }}
      - name: Fetch test models
        run: node apps/desktop/scripts/fetch-test-models.mjs .test-models
      # A restored rust-cache skips sherpa-rs-sys's build script, but the sherpa-onnx libraries it
      # downloads live outside target/ and aren't restored: rerun it (see release-desktop.yml).
      - name: Stage sherpa-onnx libraries
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clean -p sherpa-rs-sys
          cargo build -p sherpa-rs-sys
      # The app's build script needs the engine sidecar to exist, and the engine tests run it.
      - name: Build the engine
        run: node apps/desktop/scripts/build-engine.mjs --debug
      # Tauri's build script expects the frontend output folder to exist.
      - run: mkdir -p apps/desktop/dist
        shell: bash
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          # Test binaries live in target/debug/deps; sherpa-onnx's shared libraries sit in
          # target/debug (macOS links them statically).
          export LD_LIBRARY_PATH="$PWD/target/debug:${LD_LIBRARY_PATH:-}"
          export PATH="$PWD/target/debug:$PATH"
          cargo test --workspace --locked

  gpu-engine:
    name: Rust - Vulkan engine build and GPU tests (${{ matrix.os }}, software Vulkan)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    env:
      TALKR_TEST_MODELS: ${{ github.workspace }}/.test-models
      # Mesa's lavapipe driver runs Vulkan on the CPU, so the GPU code path is exercised for real
      # without a GPU on the runner.
      TALKR_TEST_GPU: '1'
      # ggml skips CPU-type Vulkan devices such as lavapipe unless they are picked explicitly.
      GGML_VK_VISIBLE_DEVICES: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: engine-vulkan-v3
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers
      - name: Install the Vulkan SDK (and lavapipe on Windows)
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          cache: true
          install_runtime: true
          install_lavapipe: ${{ runner.os == 'Windows' }}
      - name: Cache test models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .test-models
          key: test-models-${{ hashFiles('packages/model-catalog/catalog.json') }}
      - name: Fetch test models
        run: node apps/desktop/scripts/fetch-test-models.mjs .test-models
      # A restored rust-cache skips sherpa-rs-sys's build script, but the sherpa-onnx libraries it
      # downloads live outside target/ and aren't restored: rerun it (see release-desktop.yml).
      - name: Stage sherpa-onnx libraries
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clean -p sherpa-rs-sys
          cargo build -p sherpa-rs-sys
      - name: Build the GPU engine
        env:
          TALKR_REQUIRE_GPU: '1'
        run: node apps/desktop/scripts/build-engine.mjs --debug
      - name: GPU engine tests
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: |
          vulkaninfo --summary || vulkaninfoSDK --summary || true
          # Same short target folder build-engine.mjs uses on Windows (MAX_PATH, see there).
          if [ "$RUNNER_OS" = "Windows" ]; then export CARGO_TARGET_DIR=D:/talkr-vk; else export CARGO_TARGET_DIR="$PWD/target"; fi
          export LD_LIBRARY_PATH="$CARGO_TARGET_DIR/debug:${LD_LIBRARY_PATH:-}"
          export PATH="$CARGO_TARGET_DIR/debug:$PATH"
          cargo test -p talkr-engine --features vulkan --locked -- --nocapture

  # The release ships an x86_64 macOS build that the other jobs only cross-compile on Apple
  # Silicon; run the engine's unit tests on a real Intel Mac so it is at least exercised once.
  macos-intel:
    name: Rust - engine unit tests (macOS Intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: engine-intel-v1
      # Same as above: a restored cache skips the script that downloads sherpa-onnx.
      - name: Stage sherpa-onnx libraries
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clean -p sherpa-rs-sys
          cargo build -p sherpa-rs-sys
      - name: Engine unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test -p talkr-engine --lib --locked
