name: Release Desktop

# Push a tag like v0.1.0 to build installers on every platform and attach them
# to a draft GitHub Release. Review the draft, then press Publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Installers are only built from code that passes every test (see ci.yml).
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.name }}
    needs: ci
    runs-on: ${{ matrix.os }}
    env:
      # Windows and Linux ship a Vulkan build of the engine next to the CPU one; fail the release
      # rather than silently shipping without it.
      TALKR_REQUIRE_GPU: ${{ startsWith(matrix.os, 'macos') && '0' || '1' }}
      # ggml otherwise builds whisper.cpp with -march=native, i.e. for the runner's CPU (AVX-512
      # on GitHub's machines), and the app dies with "illegal instruction" on most users' PCs.
      # OFF targets the common x86-64 baseline (AVX2/FMA/F16C/BMI2), which the app checks at
      # runtime (commands/stt.rs). Apple Silicon keeps native tuning: every M-series runs it.
      GGML_NATIVE: ${{ matrix.target == 'aarch64-apple-darwin' && 'ON' || 'OFF' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Native build (no --target) so tauri.windows.conf.json finds the DLLs in target/release.
            args: ''
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # Native build (no --target) so tauri.linux.conf.json finds the .so files in target/release.
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Bump the suffix when a build setting the cache can't see changes (GGML_NATIVE and the
          # CMAKE_*_FLAGS set by build-engine.mjs are not rerun triggers for whisper-rs-sys, so a
          # restored cache would keep the old build).
          key: ${{ matrix.target }}-engine-v2

      # whisper.cpp needs CMake + clang; cpal needs ALSA; Tauri needs WebKitGTK; the AppImage
      # bundles GStreamer so audio playback works on every distro.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libudev-dev libasound2-dev patchelf cmake clang libclang-dev libvulkan-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      # The GPU engine (Windows, Linux) compiles whisper.cpp's Vulkan backend: headers and glslc.
      - name: Install the Vulkan SDK
        if: runner.os != 'macOS'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # sherpa-rs-sys downloads sherpa-onnx into a user cache folder (not restored by
      # rust-cache) and, on Windows, copies its DLLs into target/release. A restored cache
      # skips its build script, leaving the linker and tauri-build's resource check
      # (tauri.windows.conf.json) pointing at files that aren't there, and nothing orders
      # that script before ours. Rerun it on its own first, on every platform.
      - name: Stage sherpa-onnx libraries
        shell: bash
        working-directory: apps/desktop/src-tauri
        # Values reach the script through env, never pasted into it (no script injection).
        env:
          CARGO_ARGS: ${{ matrix.args }}
        run: |
          cargo clean --release -p sherpa-rs-sys $CARGO_ARGS
          cargo build --release -p sherpa-rs-sys $CARGO_ARGS
          if [ "$RUNNER_OS" = "Windows" ]; then ls -la target/release/*.dll; fi

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Talkr ${{ github.ref_name }}
          releaseBody: |
            Free, private, offline speech tools. Text to speech with Kokoro and Piper, speech to text with Whisper, all running on your own computer.

            Speech to text uses your graphics card when it can (Vulkan on Windows and Linux, Metal on macOS) and falls back to the CPU on its own. The engines run in a separate process, so a model that runs out of memory can't take the app down.

            **Which file do I need?**
            - Windows: `*_x64-setup.exe` (recommended) or `*_x64_en-US.msi`
            - macOS Apple Silicon: `*_aarch64.dmg`
            - macOS Intel: `*_x64.dmg`
            - Linux: `*.AppImage`, `*.deb` or `*.rpm`

            Builds are not code-signed yet, so Windows SmartScreen and macOS Gatekeeper will warn on first launch.
            Checksums are listed in `SHA256SUMS-*.txt`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attach SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # target/<triple>/release/bundle with --target, target/release/bundle without.
          cd apps/desktop/src-tauri/target
          out="SHA256SUMS-$TARGET.txt"
          find . -path '*release/bundle/*' -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            | while read -r f; do
                if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
              done | sed 's#  .*/#  #' > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" "$out" --clobber --repo "$REPO"
