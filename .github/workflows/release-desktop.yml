name: Release Desktop

# Push a tag like v0.1.0 to build installers on every platform and attach them
# to a draft GitHub Release. Review the draft, then press Publish.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Native build (no --target) so tauri.windows.conf.json finds the DLLs in target/release.
            args: ''
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # Native build (no --target) so tauri.linux.conf.json finds the .so files in target/release.
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      # whisper.cpp needs CMake + clang; cpal needs ALSA; Tauri needs WebKitGTK; the AppImage
      # bundles GStreamer so audio playback works on every distro.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libudev-dev libasound2-dev patchelf cmake clang libclang-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # sherpa-rs-sys's build script copies the sherpa-onnx DLLs into target/release, but a
      # restored rust-cache skips that script, and nothing orders it before tauri-build's
      # resource check (tauri.windows.conf.json). Rerun it on its own first.
      - name: Stage sherpa-onnx DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clean --release -p sherpa-rs-sys
          cargo build --release -p sherpa-rs-sys
          ls -la target/release/*.dll

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Talkr ${{ github.ref_name }}
          releaseBody: |
            Free, private, offline speech tools. Text to speech with Kokoro and Piper, speech to text with Whisper, all running on your own computer.

            **Which file do I need?**
            - Windows: `*_x64-setup.exe` (recommended) or `*_x64_en-US.msi`
            - macOS Apple Silicon: `*_aarch64.dmg`
            - macOS Intel: `*_x64.dmg`
            - Linux: `*.AppImage`, `*.deb` or `*.rpm`

            Builds are not code-signed yet, so Windows SmartScreen and macOS Gatekeeper will warn on first launch.
            Checksums are listed in `SHA256SUMS-*.txt`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attach SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # target/<triple>/release/bundle with --target, target/release/bundle without.
          cd apps/desktop/src-tauri/target
          out="SHA256SUMS-${{ matrix.target }}.txt"
          find . -path '*release/bundle/*' -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            | while read -r f; do
                if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
              done | sed 's#  .*/#  #' > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          gh release upload "${{ github.ref_name }}" "$out" --clobber --repo "${{ github.repository }}"
