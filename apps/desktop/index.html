<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talkr</title>
    <script>
      // Paint the saved theme before React loads so the window never flashes the wrong colours.
      // Mirrors useUi in src/stores/ui.ts (key `talkr.ui`) and useApplyAppearance.
      ;(function () {
        var root = document.documentElement
        var mode = 'system'
        var theme = 'graphite'
        try {
          var saved = JSON.parse(localStorage.getItem('talkr.ui') || 'null')
          var state = (saved && saved.state) || {}
          if (state.mode === 'light' || state.mode === 'dark') mode = state.mode
          if (typeof state.theme === 'string') theme = state.theme
          // Renamed ids from earlier versions. Same table as migrateThemeId in src/lib/themes.ts.
          theme = { midnight: 'nightfall', plum: 'orchid', sand: 'dune' }[theme] || theme
        } catch (e) {}
        try {
          if (mode === 'system') mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        } catch (e) {
          mode = 'dark'
        }
        // The launch screen paints before any stylesheet, so it needs the palette here:
        // [bg, surface, fg]. KEEP IN SYNC with src/lib/themes.ts and src/styles/globals.css.
        var palettes = {
          graphite: { dark: ['#0b0b0c', '#141416', '#ededea'], light: ['#f3f3f1', '#ffffff', '#121212'] },
          nightfall: { dark: ['#0a0c15', '#121526', '#e4e7f7'], light: ['#f1f3fb', '#ffffff', '#121833'] },
          forest: { dark: ['#09100c', '#101a14', '#e1ece4'], light: ['#eff4f0', '#ffffff', '#0f2419'] },
          ember: { dark: ['#110c0a', '#1b1411', '#f4e9e1'], light: ['#faf5f1', '#ffffff', '#2a170d'] },
          orchid: { dark: ['#0f0b14', '#19121f', '#eee6f6'], light: ['#f7f3fa', '#ffffff', '#24142f'] },
          dune: { dark: ['#12100b', '#1c1912', '#f0e7d4'], light: ['#f7f2e8', '#fffdf8', '#2b2417'] },
          ocean: { dark: ['#081114', '#0f1b1f', '#e0eef1'], light: ['#eef6f7', '#ffffff', '#0d2429'] },
          rose: { dark: ['#130b0e', '#1d1216', '#f6e6eb'], light: ['#fbf3f5', '#ffffff', '#2d121a'] },
        }
        if (!palettes.hasOwnProperty(theme)) theme = 'graphite'
        var colors = palettes[theme][mode]
        root.setAttribute('data-theme', theme)
        root.setAttribute('data-mode', mode)
        root.style.setProperty('--splash-bg', colors[0])
        root.style.setProperty('--splash-surface', colors[1])
        root.style.setProperty('--splash-fg', colors[2])
      })()
    </script>
    <style>
      /* Only while the launch screen is up: this unlayered rule would otherwise beat the
         themed background in globals.css (@layer base) after a live mode or theme switch. */
      html:has(#splash) { background: var(--splash-bg, #0b0b0c); }
      #splash {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: var(--splash-bg, #0b0b0c); color: var(--splash-fg, #ededea);
        transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.35s;
      }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash .lockup { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: splash-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
      #splash svg { width: 56px; height: 56px; fill: currentColor; }
      #splash .bar { transform-box: fill-box; transform-origin: center; animation: splash-bar 0.9s ease-in-out infinite alternate; }
      #splash .bar:nth-of-type(5) { animation-delay: -0.3s; }
      #splash .bar:nth-of-type(6) { animation-delay: -0.6s; }
      #splash .word { font: 600 15px/1 "Geist Variable", system-ui, sans-serif; letter-spacing: -0.02em; opacity: 0.55; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(6px) scale(0.96); } }
      @keyframes splash-bar { from { transform: scaleY(0.45); } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="lockup">
        <svg viewBox="5 5 54 54">
          <rect x="7.25" y="21" width="22" height="5.5" rx="2.75" />
          <rect x="7.25" y="29.25" width="15" height="5.5" rx="2.75" />
          <rect x="7.25" y="37.5" width="19" height="5.5" rx="2.75" />
          <rect class="bar" x="34.25" y="22" width="5.5" height="20" rx="2.75" />
          <rect class="bar" x="42.75" y="13" width="5.5" height="38" rx="2.75" />
          <rect class="bar" x="51.25" y="24.5" width="5.5" height="15" rx="2.75" />
        </svg>
        <span class="word">Talkr</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
