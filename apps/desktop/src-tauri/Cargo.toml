[package]
name = "talkr"
version = "0.1.7"
description = "Free, private, offline speech tools"
authors = ["Talkr Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "talkr_lib"
# Desktop only. (Tauri's mobile targets would also need "staticlib" and "cdylib", each a full
# copy of every dependency, which roughly triples build size and time.)
crate-type = ["rlib"]

[workspace]
members = ["protocol", "engine"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
hound = "3.5"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
# Dictation lives in the background: one instance only (a second one would install a second
# keyboard hook and type everything twice), and optionally start with the system.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2.0"
tauri-plugin-log = "2.0"
# Keep major.minor equal to @tauri-apps/plugin-updater and @tauri-apps/plugin-process in package.json.
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
log = { workspace = true }
talkr-protocol = { path = "protocol" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = "1.0"
dirs = "6.0"
sysinfo = "0.39"
num_cpus = "1.17"
walkdir = "2.5"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled", "extra_check"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
sha2 = "0.11"
tar = "0.4"
bzip2 = "0.6"
flume = "0.12"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Microphone capture (the engine process does decoding and inference)
cpal = "0.18"
hound = { workspace = true }

# System-wide dictation on Windows: the keyboard hook, text insertion (clipboard, SendInput, edit
# controls) and UI Automation to inspect and verify the focused field. Already in the tree via tao.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = { workspace = true }
# An independent decoder that checks the FLAC exporter round-trips samples exactly.
symphonia = { version = "0.6.1", default-features = false, features = ["flac"] }

# Dependencies' debug info is most of a debug build's size; line tables keep backtraces useful.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Audio DSP (rubato, symphonia) is 50-100x slower unoptimized, which makes debug builds and
# tests unusably slow on real audio.
opt-level = 2

[profile.dev.package.talkr-engine]
opt-level = 2

# Build scripts run without debug assertions: sherpa-rs-sys links the debug C runtime (msvcrtd)
# when they are on, next to whisper.cpp's release one, and two C++ runtimes in one process
# hang or crash whisper on Windows (LNK4098).
[profile.dev.build-override]
debug-assertions = false

# Smaller, faster release binaries, as recommended by the Tauri docs.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind, not abort: a panic inside a transcription or synthesis job becomes an error
# message (commands::catch_panic) instead of closing the app.
panic = "unwind"
strip = true
