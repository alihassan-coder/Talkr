[package]
name = "talkr"
version = "0.1.1"
description = "Free, private, offline speech tools"
authors = ["Talkr Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "talkr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-log = "2.0"
tauri-plugin-fs = "2.0"
log = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
dirs = "6.0"
sysinfo = "0.39"
num_cpus = "1.17"
walkdir = "2.5"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40", features = ["bundled", "extra_check"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
sha2 = "0.11"
tar = "0.4"
bzip2 = "0.6"
flume = "0.12"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Audio
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
hound = "3.5"

# Speech engines (native: whisper.cpp builds via CMake + clang; sherpa-onnx uses prebuilt libs)
whisper-rs = "0.16"

# macOS links sherpa-onnx statically, so the .app needs no extra .dylib files.
[target.'cfg(target_os = "macos")'.dependencies]
sherpa-rs = { version = "0.6", features = ["static"] }

# Windows and Linux use sherpa's shared libs (its static archives don't link there: /MT vs
# /MD on Windows, link order on Linux). The installers ship them: tauri.windows.conf.json puts
# the DLLs next to talkr.exe, and tauri.linux.conf.json puts the .so files in /usr/lib/talkr,
# where build.rs points the binary's rpath.
[target.'cfg(not(target_os = "macos"))'.dependencies]
sherpa-rs = "0.6"

[features]
# Opt-in GPU backends for whisper.cpp (require the matching SDK at build time).
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]

# Smaller, faster release binaries, as recommended by the Tauri docs.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
