<!DOCTYPE html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talkr dictation</title>
    <script>
      // The pill is always dark glass; only the accent follows the app theme. Mirrors
      // index.html's reading of useUi (src/stores/ui.ts, key `talkr.ui`).
      ;(function () {
        var root = document.documentElement
        var theme = 'graphite'
        try {
          var state = (JSON.parse(localStorage.getItem('talkr.ui') || 'null') || {}).state || {}
          if (typeof state.theme === 'string') theme = state.theme
          theme = { midnight: 'nightfall', plum: 'orchid', sand: 'dune' }[theme] || theme
          var custom = theme === 'custom' && state.customPalette && state.customPalette.dark
          if (custom && /^#[0-9a-f]{6}$/.test(custom.accent)) root.style.setProperty('--color-accent', custom.accent)
        } catch (e) {}
        root.setAttribute('data-theme', theme)
      })()
    </script>
    <style>
      html, body, #root { background: transparent !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
